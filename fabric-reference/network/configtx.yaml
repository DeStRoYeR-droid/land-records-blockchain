# ---------------------------------------------------------------------------
# configtx.yaml — channel configuration for the LandChain network
#
# Three peer organisations, each a government department, plus a separate
# ordering organisation. One application channel, created with the Fabric 2.5
# channel participation API (no system channel).
#
# All MSPDir paths are absolute *inside the configtxgen container*, which
# mounts the project root at /work.
# ---------------------------------------------------------------------------

Organizations:

  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: /work/organizations/ordererOrganizations/landchain.example/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer1.landchain.example:7050
      - orderer2.landchain.example:7050
      - orderer3.landchain.example:7050

  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: /work/organizations/peerOrganizations/org1.landchain.example/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org1MSP.peer')"
    AnchorPeers:
      - Host: peer0.org1.landchain.example
        Port: 7051

  - &Org2
    Name: Org2MSP
    ID: Org2MSP
    MSPDir: /work/organizations/peerOrganizations/org2.landchain.example/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.peer', 'Org2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org2MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org2MSP.peer')"
    AnchorPeers:
      - Host: peer0.org2.landchain.example
        Port: 7051

  - &Org3
    Name: Org3MSP
    ID: Org3MSP
    MSPDir: /work/organizations/peerOrganizations/org3.landchain.example/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org3MSP.admin', 'Org3MSP.peer', 'Org3MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org3MSP.admin', 'Org3MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org3MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org3MSP.peer')"
    AnchorPeers:
      - Host: peer0.org3.landchain.example
        Port: 7051

# ---------------------------------------------------------------------------
Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

# ---------------------------------------------------------------------------
Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

# ---------------------------------------------------------------------------
Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer1.landchain.example:7050
    - orderer2.landchain.example:7050
    - orderer3.landchain.example:7050
  EtcdRaft:
    Consenters:
      - Host: orderer1.landchain.example
        Port: 7050
        ClientTLSCert: /work/organizations/ordererOrganizations/landchain.example/orderers/orderer1.landchain.example/tls/server.crt
        ServerTLSCert: /work/organizations/ordererOrganizations/landchain.example/orderers/orderer1.landchain.example/tls/server.crt
      - Host: orderer2.landchain.example
        Port: 7050
        ClientTLSCert: /work/organizations/ordererOrganizations/landchain.example/orderers/orderer2.landchain.example/tls/server.crt
        ServerTLSCert: /work/organizations/ordererOrganizations/landchain.example/orderers/orderer2.landchain.example/tls/server.crt
      - Host: orderer3.landchain.example
        Port: 7050
        ClientTLSCert: /work/organizations/ordererOrganizations/landchain.example/orderers/orderer3.landchain.example/tls/server.crt
        ServerTLSCert: /work/organizations/ordererOrganizations/landchain.example/orderers/orderer3.landchain.example/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

# ---------------------------------------------------------------------------
Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

# ---------------------------------------------------------------------------
Profiles:

  # Genesis block for the application channel, used by `osnadmin channel join`.
  LandChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Org1
        - *Org2
        - *Org3
