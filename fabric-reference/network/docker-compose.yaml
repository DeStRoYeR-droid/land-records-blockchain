# ---------------------------------------------------------------------------
# docker-compose.yaml — the LandChain network on a single host
#
#   4 Certificate Authorities   ca-orderer, ca-org1, ca-org2, ca-org3
#   3 Raft orderers             orderer1..3.landchain.example
#   3 peers                     peer0.org{1,2,3}.landchain.example
#   1 CLI container             cli  (every admin / peer command runs here)
#
# Nothing needs to be installed on the host except Docker: fabric-ca-client,
# configtxgen, osnadmin and peer all run inside containers.
#
# Host ports live in the 12xxx range so this network can coexist with the
# previous batch's network (7xxx-11xxx) on the same machine.
# ---------------------------------------------------------------------------

name: landchain

networks:
  landchain:
    name: landchain_net

volumes:
  orderer1.landchain.example:
  orderer2.landchain.example:
  orderer3.landchain.example:
  peer0.org1.landchain.example:
  peer0.org2.landchain.example:
  peer0.org3.landchain.example:

services:

  # =========================================================================
  # Certificate Authorities — each department runs its own CA and issues its
  # own X.509 certificates. Nobody else can mint an Org2 identity.
  # =========================================================================

  ca-orderer:
    image: hyperledger/fabric-ca:${CA_VERSION:-1.5.17}
    container_name: ca-orderer
    hostname: ca-orderer
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "12054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d --csr.cn ca-orderer --csr.hosts ca-orderer,localhost'
    volumes:
      - ../organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    networks:
      - landchain

  ca-org1:
    image: hyperledger/fabric-ca:${CA_VERSION:-1.5.17}
    container_name: ca-org1
    hostname: ca-org1
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "12154:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d --csr.cn ca-org1 --csr.hosts ca-org1,localhost'
    volumes:
      - ../organizations/fabric-ca/org1:/etc/hyperledger/fabric-ca-server
    networks:
      - landchain

  ca-org2:
    image: hyperledger/fabric-ca:${CA_VERSION:-1.5.17}
    container_name: ca-org2
    hostname: ca-org2
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "12254:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d --csr.cn ca-org2 --csr.hosts ca-org2,localhost'
    volumes:
      - ../organizations/fabric-ca/org2:/etc/hyperledger/fabric-ca-server
    networks:
      - landchain

  ca-org3:
    image: hyperledger/fabric-ca:${CA_VERSION:-1.5.17}
    container_name: ca-org3
    hostname: ca-org3
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org3
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "12354:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d --csr.cn ca-org3 --csr.hosts ca-org3,localhost'
    volumes:
      - ../organizations/fabric-ca/org3:/etc/hyperledger/fabric-ca-server
    networks:
      - landchain

  # =========================================================================
  # Ordering service — 3-node Raft cluster. Tolerates one node failure.
  # =========================================================================

  orderer1.landchain.example:
    image: hyperledger/fabric-orderer:${FABRIC_VERSION:-2.5.16}
    container_name: orderer1.landchain.example
    environment: &orderer-env
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/landchain.example/orderers/orderer1.landchain.example/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/landchain.example/orderers/orderer1.landchain.example/tls:/var/hyperledger/orderer/tls
      - orderer1.landchain.example:/var/hyperledger/production/orderer
    ports:
      - "12050:7050"
      - "12053:7053"
    networks:
      - landchain

  orderer2.landchain.example:
    image: hyperledger/fabric-orderer:${FABRIC_VERSION:-2.5.16}
    container_name: orderer2.landchain.example
    environment: *orderer-env
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/landchain.example/orderers/orderer2.landchain.example/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/landchain.example/orderers/orderer2.landchain.example/tls:/var/hyperledger/orderer/tls
      - orderer2.landchain.example:/var/hyperledger/production/orderer
    ports:
      - "12060:7050"
      - "12063:7053"
    networks:
      - landchain

  orderer3.landchain.example:
    image: hyperledger/fabric-orderer:${FABRIC_VERSION:-2.5.16}
    container_name: orderer3.landchain.example
    environment: *orderer-env
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/landchain.example/orderers/orderer3.landchain.example/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/landchain.example/orderers/orderer3.landchain.example/tls:/var/hyperledger/orderer/tls
      - orderer3.landchain.example:/var/hyperledger/production/orderer
    ports:
      - "12070:7050"
      - "12073:7053"
    networks:
      - landchain

  # =========================================================================
  # Peers — one endorsing peer per department.
  # Org1 = Registration   Org2 = Revenue   Org3 = Collectorate
  # =========================================================================

  peer0.org1.landchain.example:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.16}
    container_name: peer0.org1.landchain.example
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=landchain_net
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org1.landchain.example
      - CORE_PEER_ADDRESS=peer0.org1.landchain.example:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.landchain.example:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.landchain.example:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.landchain.example:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org1.landchain.example/peers/peer0.org1.landchain.example/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org1.landchain.example/peers/peer0.org1.landchain.example/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.landchain.example:/var/hyperledger/production
    ports:
      - "12151:7051"
    networks:
      - landchain

  peer0.org2.landchain.example:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.16}
    container_name: peer0.org2.landchain.example
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=landchain_net
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org2.landchain.example
      - CORE_PEER_ADDRESS=peer0.org2.landchain.example:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.landchain.example:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.landchain.example:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.landchain.example:7051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org2.landchain.example/peers/peer0.org2.landchain.example/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org2.landchain.example/peers/peer0.org2.landchain.example/tls:/etc/hyperledger/fabric/tls
      - peer0.org2.landchain.example:/var/hyperledger/production
    ports:
      - "12251:7051"
    networks:
      - landchain

  peer0.org3.landchain.example:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.16}
    container_name: peer0.org3.landchain.example
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=landchain_net
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org3.landchain.example
      - CORE_PEER_ADDRESS=peer0.org3.landchain.example:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org3.landchain.example:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org3.landchain.example:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3.landchain.example:7051
      - CORE_PEER_LOCALMSPID=Org3MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org3.landchain.example/peers/peer0.org3.landchain.example/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org3.landchain.example/peers/peer0.org3.landchain.example/tls:/etc/hyperledger/fabric/tls
      - peer0.org3.landchain.example:/var/hyperledger/production
    ports:
      - "12351:7051"
    networks:
      - landchain

  # =========================================================================
  # DigiLocker clone — the off-chain government document authority.
  # Documents live here; only their SHA-256 fingerprints go on the ledger.
  # =========================================================================

  digilocker:
    build:
      context: ../digilocker
    image: landchain/digilocker:1.0
    container_name: digilocker
    ports:
      - "8000:8000"
    networks:
      - landchain

  # =========================================================================
  # CLI — the admin workstation. Holds every org's admin and user MSPs
  # (mounted from ./organizations) and switches identity per command.
  # =========================================================================

  cli:
    image: hyperledger/fabric-tools:${FABRIC_VERSION:-2.5.16}
    container_name: cli
    tty: true
    stdin_open: true
    environment:
      - FABRIC_LOGGING_SPEC=WARNING
      - CORE_PEER_TLS_ENABLED=true
    working_dir: /work
    command: /bin/bash
    volumes:
      - ..:/work
    depends_on:
      - peer0.org1.landchain.example
      - peer0.org2.landchain.example
      - peer0.org3.landchain.example
    networks:
      - landchain
